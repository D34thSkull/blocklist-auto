<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocklist · gestão</title>
<style>
:root {
  --bg: #eef1f3; --panel: #ffffff; --ink: #18232b; --muted: #5d6b75; --line: #d3dae0;
  --accent: #0b5f7a; --accent-ink: #ffffff; --danger: #a4262c; --ok: #1d6b3a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11181d; --panel: #1a242b; --ink: #e5ebef; --muted: #93a3ae; --line: #2f3d47;
          --accent: #4fb3d1; --accent-ink: #08212b; --danger: #ff8a8f; --ok: #6cd493; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap; padding: 18px clamp(16px, 4vw, 40px); border-bottom: 1px solid var(--line); }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 16px; margin: 0; font-weight: 650; }
main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  padding: 20px clamp(16px, 4vw, 40px) 60px; max-width: 1400px; margin: 0 auto; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.head { display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 16px; border-bottom: 1px solid var(--line); }
.count { color: var(--muted); font-size: 13px; }
form { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
input[type=text], input[type=url], textarea { flex: 1 1 160px; min-width: 0; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
textarea { resize: vertical; min-height: 38px; }
button { font: inherit; cursor: pointer; padding: 8px 14px; border-radius: 6px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; color: var(--accent); }
button.del { background: transparent; border-color: transparent; color: var(--danger); padding: 4px 8px; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; max-height: 62vh; overflow: auto; }
li { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
li.off .url { text-decoration: line-through; color: var(--muted); }
.info { flex: 1; min-width: 0; }
.url { font: 13px var(--mono); overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 12.5px; }
.empty { padding: 24px 16px; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 10px 16px;
  border-radius: 6px; background: var(--ink); color: var(--bg); max-width: 90vw; display: none; }
#toast.err { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Blocklist</h1>
  <button id="rebuild" class="ghost" hidden>Atualizar lista agora</button>
</header>
<main>
  <section aria-labelledby="t-src">
    <div class="head"><h2 id="t-src">Listas de bloqueio</h2><span class="count" id="c-src"></span></div>
    <form id="f-src">
      <input type="url" id="src-url" placeholder="https://exemplo.com/lista.txt" required aria-label="URL da lista">
      <input type="text" id="src-note" placeholder="Nota (opcional)" aria-label="Nota">
      <button>Adicionar lista</button>
    </form>
    <ul id="l-src"></ul>
  </section>

  <section aria-labelledby="t-wl">
    <div class="head"><h2 id="t-wl">Whitelist</h2><span class="count" id="c-wl"></span></div>
    <form id="f-wl">
      <textarea id="wl-domain" rows="1" placeholder="exemplo.com (um ou vários, separados por espaço ou linha)" required aria-label="Domínios"></textarea>
      <button>Permitir</button>
    </form>
    <form onsubmit="return false">
      <input type="text" id="wl-search" placeholder="Filtrar domínios" aria-label="Filtrar whitelist">
    </form>
    <ul id="l-wl"></ul>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
let state = { sources: [], whitelist: [] };

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.id); toast.id = setTimeout(() => t.style.display = 'none', 4000);
}

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.message || 'Erro ' + r.status);
  return j;
}

async function act(fn, okMsg) {
  try { const j = await fn(); toast(j.message || okMsg); await load(); }
  catch (e) { toast(e.message, true); }
}

function el(tag, props = {}, ...kids) {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach(k => n.append(k));
  return n;
}

function renderSources() {
  const ul = $('#l-src'); ul.replaceChildren();
  const on = state.sources.filter(s => s.enabled).length;
  $('#c-src').textContent = `${on} ativas de ${state.sources.length}`;
  if (!state.sources.length) ul.append(el('li', { className: 'empty' }, 'Ainda não há listas. Adiciona a primeira acima.'));
  state.sources.forEach(s => {
    const cb = el('input', { type: 'checkbox', checked: s.enabled, title: 'Ativar ou desativar',
      ariaLabel: 'Ativar ' + s.url });
    cb.onchange = () => act(() => api('PATCH', '/api/sources', { url: s.url, enabled: cb.checked }));
    const info = el('div', { className: 'info' }, el('div', { className: 'url' }, s.url));
    if (s.note) info.append(el('div', { className: 'note' }, s.note));
    const del = el('button', { className: 'del', textContent: 'Remover' });
    del.onclick = () => confirm('Remover esta lista?\n' + s.url) &&
      act(() => api('DELETE', '/api/sources', { url: s.url }));
    ul.append(el('li', { className: s.enabled ? '' : 'off' }, cb, info, del));
  });
}

function renderWhitelist() {
  const ul = $('#l-wl'); ul.replaceChildren();
  const q = $('#wl-search').value.trim().toLowerCase();
  const list = state.whitelist.filter(d => d.includes(q));
  $('#c-wl').textContent = q ? `${list.length} de ${state.whitelist.length}` : `${state.whitelist.length} domínios`;
  if (!list.length) ul.append(el('li', { className: 'empty' },
    q ? 'Nenhum domínio corresponde ao filtro.' : 'A whitelist está vazia. Adiciona um domínio acima.'));
  list.forEach(d => {
    const del = el('button', { className: 'del', textContent: 'Remover' });
    del.onclick = () => act(() => api('DELETE', '/api/whitelist', { domain: d }));
    ul.append(el('li', {}, el('div', { className: 'info url' }, d), del));
  });
}

async function load() {
  try {
    const j = await api('GET', '/api/state');
    state = j; $('#rebuild').hidden = !j.can_rebuild;
    renderSources(); renderWhitelist();
  } catch (e) { toast(e.message, true); }
}

$('#f-src').onsubmit = e => { e.preventDefault();
  act(async () => { const j = await api('POST', '/api/sources',
    { url: $('#src-url').value, note: $('#src-note').value });
    $('#f-src').reset(); return j; }); };
$('#f-wl').onsubmit = e => { e.preventDefault();
  act(async () => { const j = await api('POST', '/api/whitelist', { domain: $('#wl-domain').value });
    $('#f-wl').reset(); return j; }); };
$('#wl-search').oninput = renderWhitelist;
$('#rebuild').onclick = () => act(() => api('POST', '/api/rebuild'));
load();
</script>
</body>
</html>
