name: Generate Combined Blocklist

on:
  push:
    branches:
      - main
      - testing
    paths:
      - 'sources.txt'
      - 'whitelists/**'
      - 'generate_combined_list.py'
      - '.github/workflows/generate_list.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: generate-blocklist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Generate list
        run: python generate_combined_list.py

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined-blocklist.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-generated combined blocklist"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
